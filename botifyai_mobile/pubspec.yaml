name: botifyai_mobile
description: "BotifyAI Mobile Companion App - Omnichannel Live Chat, AI Copilot, CRM & Commerce"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing & Deep Linking
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Security & Local Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  shared_preferences: ^2.3.2

  # UI, Icons, Typography & Media
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Media, Voice & Audio (Sprint 3)
  record: ^5.1.2
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Realtime & Notifications (Sprint 2-4 preparation)
  pusher_channels_flutter: ^2.2.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

dependency_overrides:
  record_platform_interface: 1.1.0
  record_linux: 0.7.2
  flutter_plugin_android_lifecycle: 2.0.24

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0F172A"
    theme_color: "#0084FF"

flutter_native_splash:
  color: "#0F172A"
  color_dark: "#0F172A"
  image: "assets/images/logo.png"
  branding: "assets/images/botify_logo.png"
  branding_mode: bottom
  android_12:
    image: "assets/images/logo.png"
    color: "#0F172A"
    color_dark: "#0F172A"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
