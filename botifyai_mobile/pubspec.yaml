name: botifyai_mobile
description: "BotifyAI Mobile Companion App - Omnichannel Live Chat, AI Copilot, CRM & Commerce"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing & Deep Linking
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Security & Local Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  shared_preferences: ^2.3.2

  # UI, Icons, Typography & Media
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Media, Voice & Audio (Sprint 3)
  record: ^5.1.2
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Realtime & Notifications (Sprint 2-4 preparation)
  pusher_channels_flutter: ^2.2.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
